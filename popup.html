<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; width: 300px; padding: 12px; }
    .popup-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .popup-header h2 { margin: 0; font-size: 16px; flex: 1; min-width: 0; }
    label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 5px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
    textarea { height: 60px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row input { width: 50%; }
    button { margin-top: 12px; width: 100%; padding: 8px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
    #saveBtn { background: #333; color: #fff; }
    #fillBtn { background: #2563eb; color: #fff; margin-top: 0; width: auto; flex-shrink: 0; padding: 6px 10px; font-size: 12px; white-space: nowrap; }
    #status { font-size: 12px; color: green; margin: 0 0 10px; text-align: right; min-height: 16px; }
  </style>
</head>
<body>
  <div class="popup-header">
    <h2>Job App Filler</h2>
    <button id="fillBtn">Fill This Form</button>
  </div>
  <div id="status"></div>

  <div class="row">
    <div>
      <label>First Name</label>
      <input id="firstName" placeholder="Jane" />
    </div>
    <div>
      <label>Last Name</label>
      <input id="lastName" placeholder="Doe" />
    </div>
  </div>

  <label>Preferred Name</label>
  <input id="preferredName" placeholder="Jay (if different)" />

  <label>Email</label>
  <input id="email" placeholder="jane@email.com" />

  <label>Phone</label>
  <input id="phone" placeholder="555-555-5555" />

  <label>Address</label>
  <input id="address" placeholder="123 Main St" />

  <div class="row">
    <div>
      <label>City</label>
      <input id="city" placeholder="Austin" />
    </div>
    <div>
      <label>State</label>
      <input id="state" placeholder="TX" />
    </div>
  </div>

  <label>Zip</label>
  <input id="zip" placeholder="78701" />

  <label>LinkedIn URL</label>
  <input id="linkedin" placeholder="linkedin.com/in/jane" />

  <label>Portfolio / Website</label>
  <input id="website" placeholder="janedoe.com" />

  <label>Current Job Title</label>
  <input id="jobTitle" placeholder="Senior UX Designer" />

  <label>Current Employer</label>
  <input id="employer" placeholder="Acme Corp" />

  <label>Salary Expectation</label>
  <input id="salary" placeholder="$90,000" />

  <label>Travel Availability</label>
  <select id="travelAvailability">
    <option value="">Not set</option>
    <option value="0-25%">0-25%</option>
    <option value="25-50%">25-50%</option>
    <option value="50-75%">50-75%</option>
    <option value="75-100%">75-100%</option>
  </select>

  <label>Willing to Relocate</label>
  <select id="relocationWillingness">
    <option value="">Not set</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <label>Family Member Works at Company</label>
  <select id="familyWorksAtCompany">
    <option value="">Not set</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <label>Worked or Applied Here Before</label>
  <select id="priorCompanyRelationship">
    <option value="">Not set</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <label>US Work Authorization</label>
  <select id="workAuthorization">
    <option value="">Not set</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <label>Gender</label>
  <select id="gender">
    <option value="">Not set</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="non-binary">Non-binary</option>
    <option value="other">Other</option>
    <option value="prefer not to say">Prefer not to say</option>
  </select>

  <label>Race / Ethnicity</label>
  <select id="race">
    <option value="">Not set</option>
    <option value="american indian">American Indian or Alaska Native</option>
    <option value="asian">Asian</option>
    <option value="black">Black or African American</option>
    <option value="hispanic">Hispanic or Latino</option>
    <option value="native hawaiian">Native Hawaiian or Other Pacific Islander</option>
    <option value="white">White</option>
    <option value="two or more races">Two or more races</option>
    <option value="prefer not to say">Prefer not to say</option>
  </select>

  <label>Disability Status</label>
  <select id="disability">
    <option value="">Not set</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
    <option value="prefer not to say">Prefer not to say</option>
  </select>

  <label>Veteran Status</label>
  <select id="veteran">
    <option value="">Not set</option>
    <option value="yes">Yes</option>
    <option value="no">No</option>
    <option value="prefer not to say">Prefer not to say</option>
  </select>

  <label>Education</label>
  <select id="educationLevel">
    <option value="">Not set</option>
    <option value="high school">High School</option>
    <option value="associate">Associate's Degree</option>
    <option value="bachelor">Bachelor's Degree</option>
    <option value="master">Master's Degree</option>
    <option value="mba">Master of Business Administration (M.B.A.)</option>
    <option value="jd">Juris Doctor (J.D.)</option>
    <option value="md">Doctor of Medicine (M.D.)</option>
    <option value="phd">Doctor of Philosophy (Ph.D.)</option>
    <option value="engineer">Engineer's Degree</option>
    <option value="other">Other</option>
  </select>

  <label>Available Start Date</label>
  <input id="startDate" placeholder="2 weeks notice" />

  <label>Cover Letter (optional)</label>
  <textarea id="coverLetter" placeholder="Paste a default cover letter..."></textarea>

  <button id="saveBtn">Save Settings</button>

  <script src="popup.js"></script>
</body>
</html>
