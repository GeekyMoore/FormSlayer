<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>embed form fixture</title></head>
<body>
<form>
  <label id="first_name-label" for="first_name">First Name</label>
  <input id="first_name" type="text" aria-label="First Name" autocomplete="given-name" />
  <label id="last_name-label" for="last_name">Last Name</label>
  <input id="last_name" type="text" aria-label="Last Name" autocomplete="family-name" />
  <label id="preferred_name-label" for="preferred_name">Preferred First Name</label>
  <input id="preferred_name" type="text" aria-label="Preferred First Name" />
  <label id="email-label" for="email">Email</label>
  <input id="email" type="text" aria-label="Email" autocomplete="email" />
  <label id="country-label" for="country" class="label select__label">Country</label>
  <input id="country" class="select__input" type="text" role="combobox" aria-labelledby="country-label" />
  <label id="phone-label" for="phone">Phone</label>
  <input id="phone" type="tel" aria-label="Phone" />
  <label id="question_linkedin-label" for="question_linkedin">LinkedIn Profile</label>
  <textarea id="question_linkedin" aria-label="LinkedIn Profile"></textarea>
  <label id="question_website-label" for="question_website">Website or Portfolio (password if required)</label>
  <input id="question_website" type="text" aria-label="Website or Portfolio (password if required)" />
  <label id="question_prior-label" for="question_prior" class="label select__label">Have you ever been employed by us or any of it&#x27;s subsidiaries or brands?</label>
  <input id="question_prior" class="select__input" type="text" role="combobox" aria-labelledby="question_prior-label" />
  <label id="question_state-label" for="question_state" class="label select__label">State of Residence</label>
  <input id="question_state" class="select__input" type="text" role="combobox" aria-labelledby="question_state-label" />
  <label id="question_salary-label" for="question_salary">What is your desired base salary?</label>
  <input id="question_salary" type="text" aria-label="What is your desired base salary?" />
  <label id="question_zip-label" for="question_zip">Zip / Postal</label>
  <input id="question_zip" type="text" aria-label="Zip / Postal" />
</form>
</body>
</html>
