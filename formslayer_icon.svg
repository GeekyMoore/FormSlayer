<svg width="128" height="128" viewBox="0 0 128 128" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>FormSlayer icon</title>
  <desc>A sword slicing through a stack of job application forms</desc>

  <rect width="128" height="128" rx="22" fill="#1a1a2e"/>

  <ellipse cx="64" cy="64" rx="38" ry="38" fill="#e63946" opacity="0.12"/>

  <!-- paper stack -->
  <rect x="28" y="88" width="72" height="6" rx="2" fill="#3a3a5c"/>
  <rect x="30" y="80" width="68" height="12" rx="2" fill="#2e2e50"/>
  <rect x="32" y="70" width="64" height="14" rx="2" fill="#f0f0f8"/>
  <!-- form lines -->
  <rect x="38" y="75" width="28" height="3" rx="1" fill="#c0c0d8"/>
  <rect x="38" y="81" width="42" height="2" rx="1" fill="#d0d0e4"/>

  <!-- red slash -->
  <line x1="30" y1="68" x2="98" y2="88" stroke="#e63946" stroke-width="3" stroke-linecap="round"/>

  <!-- sword blade -->
  <polygon points="64,14 69,88 59,88" fill="#c8d6e5"/>
  <polygon points="64,14 68,88 64,55" fill="#e8f0f8" opacity="0.6"/>

  <!-- crossguard -->
  <rect x="46" y="86" width="36" height="8" rx="3" fill="#b8960c"/>
  <rect x="48" y="88" width="32" height="4" rx="2" fill="#d4ac0d"/>

  <!-- grip -->
  <rect x="59" y="94" width="10" height="20" rx="3" fill="#6b3a2a"/>

  <!-- pommel -->
  <circle cx="64" cy="118" r="6" fill="#b8960c"/>
  <circle cx="64" cy="118" r="4" fill="#d4ac0d"/>

  <!-- sparks -->
  <circle cx="95" cy="72" r="3" fill="#e63946" opacity="0.9"/>
  <circle cx="100" cy="62" r="2" fill="#ff9f43" opacity="0.8"/>
  <circle cx="30" cy="74" r="2" fill="#ff9f43" opacity="0.7"/>
  <circle cx="98" cy="82" r="2" fill="#e63946" opacity="0.8"/>

  <!-- flying paper scraps -->
  <rect x="96" y="58" width="14" height="10" rx="1" fill="#f0f0f8" opacity="0.8" transform="rotate(-20 103 63)"/>
  <rect x="18" y="62" width="12" height="9" rx="1" fill="#f0f0f8" opacity="0.7" transform="rotate(15 24 66)"/>
</svg>