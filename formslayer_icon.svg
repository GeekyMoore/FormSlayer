<svg width="128" height="128" viewBox="0 0 128 128" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>FormSlayer icon</title>
  <desc>A sword slicing through a form</desc>

  <!-- form -->
  <rect x="14" y="58" width="100" height="34" rx="5" fill="#f5f7ff"/>
  <rect x="22" y="67" width="46" height="5" rx="2" fill="#b8c0d8"/>
  <rect x="22" y="78" width="64" height="5" rx="2" fill="#ccd3e8"/>

  <!-- slash -->
  <line x1="16" y1="48" x2="112" y2="82" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>

  <!-- sword blade -->
  <polygon points="64,6 78,82 50,82" fill="#dce8f5"/>
  <polygon points="64,6 73,82 64,52" fill="#ffffff" opacity="0.8"/>

  <!-- crossguard -->
  <rect x="34" y="80" width="60" height="12" rx="5" fill="#d4ac0d"/>

  <!-- grip -->
  <rect x="56" y="88" width="16" height="26" rx="5" fill="#6b3a2a"/>

  <!-- pommel -->
  <circle cx="64" cy="119" r="8" fill="#d4ac0d"/>
</svg>